
name: Build Arabic Tomb Raider APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q TombRaider-Arabic-GitHub.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/tomb-raider-launcher-main
          gradle --no-daemon assembleTrRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tomb-Raider-Arabic-APK
          path: extracted/tomb-raider-launcher-main/app/build/outputs/apk/tr/release/*.apk
          if-no-files-found: error
